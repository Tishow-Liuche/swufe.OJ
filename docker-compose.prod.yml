services:
  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: swufe-oj:latest
    container_name: oj-migrate
    restart: "no"
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file:
      - ${APP_ENV_FILE:-config/app.prod.env}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: swufe-oj:latest
    container_name: oj-backend
    restart: unless-stopped
    init: true
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    env_file:
      - ${APP_ENV_FILE:-config/app.prod.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  judge-worker:
    image: swufe-oj:latest
    container_name: oj-judge-worker
    restart: unless-stopped
    init: true
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      NODE_OPTIONS: --max-old-space-size=384
      JUDGE_WORKER_CONCURRENCY: ${JUDGE_WORKER_CONCURRENCY:-1}
    env_file:
      - ${APP_ENV_FILE:-config/app.prod.env}
    command: ["node", "dist/src/judge-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      go-judge:
        condition: service_started

  caddy:
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    image: swufe-oj-caddy:latest
    container_name: oj-caddy
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file:
      - ${PROXY_ENV_FILE:-config/proxy.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
